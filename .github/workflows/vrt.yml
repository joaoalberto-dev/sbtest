name: vrt

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: build vrt-cli
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.VRT_REPO_TOKEN }}@github.com/joaoalberto-dev/vrt.git /tmp/vrt
          cd /tmp/vrt/apps/cli && go build -o "$RUNNER_TEMP/vrt-cli" ./cmd/cli
      - run: npm ci
      - run: npx storybook build
      - run: $RUNNER_TEMP/vrt-cli upload .
        env:
          VRT_API_KEY: ${{ secrets.VRT_API_KEY }}